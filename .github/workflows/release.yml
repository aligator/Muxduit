name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  flatpak:
    name: build Flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$VERSION" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from datetime import date
          from pathlib import Path

          version = sys.argv[1]
          path = Path("flatpak/dev.aligator.muxduit.metainfo.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          releases = root.find("releases")
          if releases is None:
              releases = ET.SubElement(root, "releases")
          for release in list(releases):
              releases.remove(release)
          ET.SubElement(releases, "release", {"version": version, "date": date.today().isoformat()})
          ET.indent(tree, space="  ")
          tree.write(path, encoding="UTF-8", xml_declaration=True)
          PY

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: muxduit-${{ steps.version.outputs.version }}.flatpak
          manifest-path: flatpak/dev.aligator.muxduit.yml
          cache-key: flatpak-builder-${{ github.sha }}
          verbose: true

      - name: Upload Flatpak bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: muxduit-${{ steps.version.outputs.version }}.flatpak

  windows:
    name: build Windows installer (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            ffmpeg: win64
          - arch: arm64
            os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            ffmpeg: winarm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Install Trunk and Tauri CLI
        run: |
          cargo install trunk --locked
          cargo install tauri-cli --version "^2" --locked

      # FFmpeg is not available on Windows, so a GPL static build is bundled as
      # a Tauri sidecar and ends up next to muxduit.exe (see `tool_path`).
      - name: Fetch FFmpeg sidecars
        shell: pwsh
        run: |
          $name = "ffmpeg-n8.1-latest-${{ matrix.ffmpeg }}-gpl-8.1"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-dist
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item "ffmpeg-dist/$name/bin/ffmpeg.exe" "src-tauri/binaries/ffmpeg-${{ matrix.triple }}.exe"
          Copy-Item "ffmpeg-dist/$name/bin/ffprobe.exe" "src-tauri/binaries/ffprobe-${{ matrix.triple }}.exe"

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "Bundling version $version"
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 32 | Set-Content $path

      # NSIS only: the MSI bundler needs WiX, which has no arm64 story.
      - name: Build Windows installer
        run: cargo tauri-build --bundles nsis

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*-setup.exe
